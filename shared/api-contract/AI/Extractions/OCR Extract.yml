info:
  name: OCR Extract (ai/ocr/extract)
  type: http
  seq: 3

http:
  method: POST
  url: "{{aiBaseUrl}}/ai/ocr/extract"
  body:
    type: multipart-form
    data:
      - name: cardImage
        type: file
        value:
          - /home/mcqeems/Documents/Project/UINIC 8.0/tiby/shared/assets/images/ocr-test.jpeg
        contentType: image/jpeg
        description: Treatment-card photo (image/jpeg, image/png, image/webp; max 10 MB).
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Response is an onboarding draft", function() {
          expect(res.body).to.have.property("patientName");
          expect(res.body).to.have.property("regimenCode");
          expect(res.body).to.have.property("dailyPillQuota");
          expect(res.body).to.have.property("startDate");
          expect(res.body).to.have.property("targetEndDate");
          expect(res.body).to.have.property("confidence");
          expect(res.body).to.have.property("rawText");
          expect(res.body).to.have.property("fieldConfidence");
          expect(res.body).to.have.property("uncertainties");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 - TBC.05 lab-request scan
    request:
      url: "{{aiBaseUrl}}/ai/ocr/extract"
      method: POST
      body:
