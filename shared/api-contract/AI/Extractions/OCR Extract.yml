docs: |-
  Reads a treatment-card photo into an **unconfirmed** onboarding draft:
  patient name, regimen code, daily pill quota, start date, target end date.
  It never diagnoses and never recommends a dose; a Nakes re-checks every field
  against the image before saving.

  - multipart field: `cardImage` (required)
  - accepted content types: `image/png`, `image/jpeg`, `image/jpg`, `image/webp`
  - size limit: 10 MB -> `413`, other content type -> `415`, undecodable bytes -> `422`

  Read `fieldConfidence` and `uncertainties` before trusting a value. A field
  that is `null` with confidence `0.0` means its label was not found on that
  layout, not that the card has no value: fill it in manually. The parser knows
  the common Indonesian treatment-card labels (`Nama Pasien`/`Nama Terduga`,
  `Regimen`/`Paduan Obat`, `Dosis`/`Kuota`, `Tanggal Mulai`/`Mulai Terapi`,
  `Tanggal Selesai`) and ignores facility, clinician and identity columns, so
  the same request works across card layouts without retraining.
