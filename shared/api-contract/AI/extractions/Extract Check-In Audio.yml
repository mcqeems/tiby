info:
  name: Extract Check-In Audio (ai/extractions/check-in/audio)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/ai/extractions/check-in/audio"
  body:
    type: multipart-form
    data:
      - name: audio
        type: file
        value:
          - AI/Examples/check-in-audio.wav
        contentType: audio/wav
        description: Check-in recording (audio/wav, audio/mp3, audio/mpeg, audio/ogg, audio/webm; max 10 MB).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Transcribes a check-in audio file and returns the transcript only. No facts,
  no diagnosis, no risk level.

  Fact extraction is a separate step: send the transcript the patient confirmed
  (after editing, if the transcription was wrong) to `POST /ai/extractions/check-in`,
  which answers with the `AiAudioExtractionResponse` JSON body.

  Speech-to-text is Groq Whisper by default; server env `TIBY_TRANSCRIBER=fish` switches to Fish Audio.

  Error codes follow the shared `ApiError` envelope:
  - 413: Audio is empty or larger than 10 MB (ApiError).
  - 415: Unsupported audio content type (ApiError).
  - 502: Transcription provider failed (ApiError).
  - 503: Transcription provider not configured (ApiError).
  - 504: Transcription provider timed out (ApiError).

examples:
  - name: "200 - audio transcribed"
    request:
      url: "{{baseUrl}}/ai/extractions/check-in/audio"
      method: POST
      body:
        type: multipart-form
        data:
          - name: audio
            type: file
            value:
              - AI/Examples/check-in-audio.wav
            contentType: audio/wav
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "transcript": "Halo Pandu, saya sudah minum 4 butir obat pagi ini dan tidak ada keluhan."
          }
