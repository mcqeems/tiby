info:
  name: Extract Check-In Facts
  type: http
  seq: 1

http:
  method: POST
  url: "{{aiBaseUrl}}/v1/extractions/check-in"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "transcript": "Sudah minum obat empat biji. Mual dari siang dan tidak nafsu makan.",
        "language": "id-ID"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Response contains structured extraction", function() {
          expect(res.body).to.have.property("extraction");
          expect(res.body).to.have.property("confidence");
          expect(res.body.extraction).to.have.property("medication");
          expect(res.body.extraction).to.have.property("symptoms");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Extracts reported facts from a patient check-in transcript. It does not diagnose or assign clinical risk.

  Responses:
  - 200: Facts extracted successfully; not a clinical assessment.
  - 422: Request validation failed (ApiError).
  - 502: Extraction provider failed or returned invalid output (ApiError).
  - 504: Extraction provider timed out (ApiError).
