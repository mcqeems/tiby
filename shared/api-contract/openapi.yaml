openapi: 3.1.0
info:
  title: Tiby AI Extraction API
  version: 1.0.0
  description: Extracts reported facts from a patient check-in transcript. It does not diagnose or assign clinical risk.
servers:
  - url: http://localhost:8000
paths:
  /v1/extractions/check-in:
    post:
      operationId: extractCheckIn
      summary: Extract structured facts from a check-in transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
            example:
              transcript: Sudah minum obat empat biji. Mual dari siang dan tidak nafsu makan.
              language: id-ID
      responses:
        '200':
          description: Facts extracted successfully; not a clinical assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: Extraction provider failed or returned invalid output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: Extraction provider timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    CheckInRequest:
      type: object
      additionalProperties: false
      required: [transcript]
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 5000
          description: Plain text produced by speech-to-text or entered manually. Audio is not accepted here.
        language:
          type: string
          default: id-ID
          examples: [id-ID]
    MedicationReport:
      type: object
      additionalProperties: false
      required: [taken, dose_count]
      properties:
        taken:
          type: [boolean, 'null']
          description: True/false only when explicitly reported; otherwise null.
        dose_count:
          type: [integer, 'null']
          minimum: 0
          description: Reported count only; not checked against a prescription.
    Symptom:
      type: object
      additionalProperties: false
      required: [name, severity, evidence]
      properties:
        name:
          type: string
          minLength: 1
          description: Short normalized phrase, not a diagnosis.
        severity:
          type: string
          enum: [mild, moderate, severe, unknown]
        evidence:
          type: string
          minLength: 1
          description: Supporting phrase quoted from the transcript.
    Extraction:
      type: object
      additionalProperties: false
      required: [medication, symptoms, possible_red_flags, intent_to_stop]
      properties:
        medication:
          $ref: '#/components/schemas/MedicationReport'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Symptom'
        possible_red_flags:
          type: array
          items:
            type: string
          description: Candidate signals only; backend rules determine action.
        intent_to_stop:
          type: [boolean, 'null']
          description: True only for explicit intent; null if uncertain or unstated.
    CheckInResponse:
      type: object
      additionalProperties: false
      required: [schema_version, extraction, confidence, uncertainties]
      properties:
        schema_version:
          type: string
          const: '1.0'
        extraction:
          $ref: '#/components/schemas/Extraction'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Extraction confidence, not a clinical probability.
        uncertainties:
          type: array
          items:
            type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, EXTRACTION_FAILED, PROVIDER_TIMEOUT, INTERNAL]
        message:
          type: string
        request_id:
          type: [string, 'null']
