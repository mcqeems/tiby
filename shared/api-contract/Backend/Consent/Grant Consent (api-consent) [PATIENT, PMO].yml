info:
  name: Grant Consent (api/consent) [PATIENT, PMO]
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/consent"
  body:
    type: json
    data: |-
      {
        "scopes": [
          // array of at least 1 scope:
          // "PATIENT_DATA_SHARE" | "PMO_STATUS_ONLY" | "STT_AUDIO_PROCESSING"
          "PATIENT_DATA_SHARE",
          "PMO_STATUS_ONLY",
          "STT_AUDIO_PROCESSING"
        ],
        "scheduleConfirmed": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

