        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "active": true,
            "expiresAt": "2026-10-29T10:52:18.241Z",
            // live sessions only; expired rows are excluded before cleanup
            "activeCount": 1,
            "maxActive": 10,
            "sessions": [
              {
                // last 4 hex chars of the session id, never the raw id
                "label": "35A7",
                "startedAt": "2026-10-29T08:52:18.247Z",
                "expiresAt": "2026-10-29T10:52:18.241Z",
                // true only for the session owned by the caller's cookie
                "isMine": true
              }
            ]
          }
