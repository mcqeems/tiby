info:
  name: Get Demo Status (api/demo/status) [ALL]
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/demo/status"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get Demo Status - idle (200)
    request:
      url: "{{baseUrl}}/api/demo/status"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "78"
        - name: etag
          value: W/"4e-79KUsH4uarQf802GfIeqLoW0/FY"
        - name: date
          value: Thu, 29 Oct 2026 08:52:18 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            // false when the caller has no valid tiby_demo cookie
            "active": false,
            "expiresAt": null,
            "activeCount": 0,
            "maxActive": 10,
            "sessions": []
          }
  - name: Get Demo Status - own session active (200)
