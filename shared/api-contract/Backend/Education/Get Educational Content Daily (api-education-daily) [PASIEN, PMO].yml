info:
  name: Get Educational Content Daily (api/education/daily) [PASIEN, PMO]
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/education/daily"
  params:
    - name: phase
      value: ""
      type: query
      description: "INTENSIF | LANJUTAN, Default: ALL"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get Educational Content Daily (200)
    request:
      url: "{{baseUrl}}/api/education/daily"
      method: GET
      params:
        - name: phase
          value: ""
          type: query
          description: "INTENSIF | LANJUTAN, Default: ALL"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "1826"
        - name: etag
          value: W/"722-0IHhMfDwxaBZcvDVMiI0e+dxGIQ"
        - name: date
          value: Mon, 19 Oct 2026 04:06:15 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "cards": [
              {
                "id": "card-intensif-01",
                "title": "Mengapa Obat Harus Diminum Setiap Hari Tanpa Putus?",
                "summary": "Konsistensi adalah kunci utama kesembuhan total dan pencegahan kekebalan obat.",
                "contentMarkdown": "### Disiplin Minum Obat Bersama Pandu\nTerapi pengobatan membutuhkan waktu beberapa bulan agar kuman dapat dihilangkan secara menyeluruh. Meminum obat secara teratur setiap hari menjaga kadar obat tetap optimal di dalam tubuh.\n\n**Tips Sehari-hari:**\n- Tetapkan alarm harian pada jam yang sama setiap pagi atau malam.\n- Minta PMO (Pendamping Minum Obat) untuk saling menyemangati.\n- Jika ada keluhan ringan, segera laporkan lewat fitur check-in Pandu.",
                "category": "ADHERENCE",
                "phase": "INTENSIF"
              },
              {
                "id": "card-intensif-02",
                "title": "Mengenal Perubahan Warna Air Seni yang Wajar",
                "summary": "Warna air kencing kemerahan atau oranye adalah tanda alami salah satu obat bekerja.",
                "contentMarkdown": "### Air Seni Berwarna Kemerahan?\nJangan khawatir! Salah satu komponen obat (Rifampisin) memang secara alami menyebabkan air seni, keringat, atau air mata berwarna merah atau oranye.\n\nIni adalah efek samping yang **sangat wajar dan tidak berbahaya**. Tetap minum air putih yang cukup dan lanjutkan minum obat sesuai anjuran petugas kesehatan.",
                "category": "SIDE_EFFECTS",
                "phase": "INTENSIF"
              },
              {
                "id": "card-lanjutan-01",
                "title": "Memasuki Tahap Lanjutan: Jangan Lengah!",
                "summary": "Badan sudah terasa segar, namun pengobatan harus dituntaskan hingga tuntas.",
                "contentMarkdown": "### Selamat Memasuki Tahap Lanjutan!\nBanyak sahabat Pandu merasa tubuhnya sudah sehat pada tahap ini. Namun, kuman yang sedang 'tertidur' harus dipastikan benar-benar tuntas.\n\nTetaplah bersemangat dan rutin menyelesaikan jadwal terapi Anda bersama Pandu hingga dinyatakan tuntas oleh dokter puskesmas!",
                "category": "ADHERENCE",
                "phase": "LANJUTAN"
              }
            ]
          }
