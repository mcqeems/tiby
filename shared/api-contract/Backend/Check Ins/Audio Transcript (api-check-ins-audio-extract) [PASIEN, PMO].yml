info:
  name: Audio Transcript (api/check-ins/audio-extract) [PASIEN, PMO]
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/check-ins/audio-extract"
  body:
    type: multipart-form
    data:
      - name: audio
        type: file
        value:
          - /home/mcqeems/Documents/Project/UINIC 8.0/tiby/shared/assets/audio/audio-transcript-test.mp3
        contentType: audio/mpeg
      - name: treatmentPlanId
        type: text
        value: bb1adaae-b7fc-4621-9bdb-26948c44406a
        description: Optional if it's Patient and MANDATORY if it's PMO
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Audio Transcript (201)
    request:
      url: "{{baseUrl}}/api/check-ins/audio-extract"
      method: POST
      body:
        type: multipart-form
        data:
          - name: audio
            type: file
            value:
              - /home/mcqeems/Documents/Project/UINIC 8.0/tiby/shared/assets/audio/audio-transcript-test.mp3
            contentType: audio/mpeg
          - name: treatmentPlanId
            type: text
            value: bb1adaae-b7fc-4621-9bdb-26948c44406a
            description: Optional if it's Patient and MANDATORY if it's PMO
    response:
      status: 201
      statusText: Created
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "90"
        - name: etag
          value: W/"5a-kHWIBe4iBnnjQhhhGw6FAP2Xs1M="
        - name: date
          value: Sun, 18 Oct 2026 03:14:09 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "transcript": "Halo Pandu, saya sudah minum 4 butir obat pagi ini dan tidak ada keluhan."
          }

docs: |-
  Transcribes a check-in recording and returns the transcript only. No facts,
  no diagnosis, no risk level: the backend is a bridge, not a second extractor.

  Send the transcript the patient confirmed (after editing, if the
  transcription was wrong) to `POST /api/check-ins/text-extract` to get the
  facts. `POST /api/check-ins` then submits them for the deterministic safety
  rules.

  Responses:
  - 201: `{ "transcript": string }` only.
  - 400: Missing audio file or unsupported content type.
  - 403: Patient must confirm consent first.
  - 502 / 503 / 504: Transcription provider failed, is not configured, or
    timed out; the backend answers with its offline fallback transcript.
