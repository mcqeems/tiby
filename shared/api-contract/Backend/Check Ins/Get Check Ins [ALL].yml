docs: |-
  # Notes

  ## Scope

  **ADMIN**: Can view all at all facilities.

  **NAKES**: Can view all patient at the same facilities.

  **PMO**: Can view all patient that is assigned to him/her.

  **PATIENT**: Can view it's own check ins.
