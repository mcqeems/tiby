info:
  name: "[AI UNFINISHED] Submit Check-In (api/check-ins) [PATIENT, PMO]"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/check-ins"
  body:
    type: json
    data: |-
      // Taken from Text Extract
      {
        //   "inputMode": "VOICE_STT", // VOICE_STT | FALLBACK_BUTTONS (Mekanisme Fallback Button == Mekanisme Input Manual) 
        // //   "treatmentPlanId": "uuid (optional if caller is PASIEN and MANDATORY if it's PMO)",
        //   "confirmedFacts": {
        //     "transcript": "Halo Pandu, saya sudah minum 4 butir obat pagi ini dan tidak ada keluhan.",
        //     "medicationStatus": "SUDAH_MINUM", // "SUDAH_MINUM" | "BELUM_MINUM" | "TIDAK_PASTI" (required)
        //     "pillsTakenCount": 4,
        //     "symptoms": [], // Taken from MinorSideEffects and MajorSideEffects at @shared/ts-shared/src/enums.ts
        //     "intentToStop": false, // False if it's good and True if it's bad
        //     "confidence": 1
        //   }
        
        //   // If the input mode is fallback buttons
        "inputMode": "FALLBACK_BUTTONS", // VOICE_STT | FALLBACK_BUTTONS (Mekanisme Fallback Button == Mekanisme Input Manual) 
      //   "treatmentPlanId": "uuid (optional if caller is PASIEN and MANDATORY if it's PMO)",
        "fallbackButtons": {
          "medicationStatus": "SUDAH_MINUM", // "SUDAH_MINUM" | "BELUM_MINUM" | "TIDAK_PASTI" (required)
          "pillsTakenCount": 4,
          "hasComplaints": false, // Boolean (false | true)
          "selectedComplaints": []
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

