info:
  name: Get Whatsapp Status (api/whatsapp/status) [ALL]
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/whatsapp/status?familyContactId=7efa06de-09bf-49f3-ba4e-1db562b995c6"
  params:
    - name: familyContactId
      value: 7efa06de-09bf-49f3-ba4e-1db562b995c6
      type: query
      description: uuid — show a family contact's status instead of the caller's
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Pending challenge (200)
    request:
      url: "{{baseUrl}}/api/whatsapp/status"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "verified": false,
            "phoneNumber": "081234567890",
            "pendingCode": "K9X4T2",
            "expiresAt": "2026-10-27T08:15:00.000Z",
            "verifiedAt": null
          }
  - name: Verified (200)
    request:
      url: "{{baseUrl}}/api/whatsapp/status"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "verified": true,
            "phoneNumber": "081234567890",
            "pendingCode": null,
            "expiresAt": null,
            "verifiedAt": "2026-10-27T08:03:12.000Z"
          }

docs: |-
  Current WhatsApp connection for the caller, or for one family contact when
  `familyContactId` is given. An expired pending code is treated as absent.

  `pendingCode` is the code the client should still display; it disappears once
  the challenge expires or is replaced. `phoneNumber` is the number proven by
  the handshake.

  Responses:
  - 200: Status (verified or pending).
  - 404: Family contact not found or not visible to the caller.
