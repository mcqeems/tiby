info:
  name: Change Password (api/users/change-password)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/users/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "pwgampang",
        "newPassword": "pwgampang_123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Change Password (201)
    request:
      url: "{{baseUrl}}/api/users/change-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "currentPassword": "pwgampang",
            "newPassword": "pwgampang_123"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "58"
        - name: etag
          value: W/"3a-Zb8Lj6PnNQs5DZCcUT3gEMZ3wC4"
        - name: date
          value: Sat, 17 Oct 2026 08:48:53 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Password successfully changed"
          }
