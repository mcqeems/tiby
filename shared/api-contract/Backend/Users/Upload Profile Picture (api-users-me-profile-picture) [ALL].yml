  method: POST
  url: "{{baseUrl}}/api/users/me/profile-picture"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/mcqeems/Documents/Project/UINIC 8.0/tiby/shared/assets/images/profile.jpg
        contentType: image/jpeg
