info:
  name: Whatsapp Connect (api/whatsapp/connect) [ALL]
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/whatsapp/connect"
  body:
    type: json
    data: |-
      {
        "phoneNumber": "string (required, Indonesian WhatsApp number e.g. '08123456789')",
        "familyContactId": "uuid (optional, if registering secondary family contact)"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
