services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3008:3000"
    env_file: .env
    volumes:
      - ./sessions:/app/.sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # WAHA lives in a container; localhost would be the container itself.
      WHATSAPP_HOOK_URL: http://host.docker.internal:3001/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message
      # Must match WAHA_WEBHOOK_SECRET in app/backend/.env.
      WHATSAPP_HOOK_CUSTOM_HEADERS: "X-Waha-Secret:${WAHA_WEBHOOK_SECRET}"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WHATSAPP_START_SESSION: "default"
