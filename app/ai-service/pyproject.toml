[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiby-ai-service"
version = "0.1.0"
description = "Tiby AI extraction service"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pymupdf>=1.28.2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tiby_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
