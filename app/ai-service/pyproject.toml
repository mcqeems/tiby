[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiby-ai-service"
version = "0.1.0"
description = "Tiby AI extraction service"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mypy>=2.4.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "pydantic>=2.7,<3",
  "pymupdf>=1.28.2",
  "python-multipart>=0.0.9,<1",
  "rapidocr==3.10.0",
  "onnxruntime>=1.22,<2",
  "ruff>=0.17.1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "types-PyYAML>=6,<7",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
# `src` is the import root: modules install top-level (`main`, `contracts`,
# `extraction.*`, ...) and are reached with PYTHONPATH=src, not as a `tiby_ai`
# package. `sources` strips the directory so `src/main.py` lands as `main.py`.
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
